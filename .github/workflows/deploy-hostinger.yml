name: Build and deploy Flutter web to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build web app
        run: flutter build web --release

      - name: Verify web build
        run: test -s build/web/index.html

      - name: Check Hostinger deployment configuration
        id: hostinger-config
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USERNAME: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          missing=()
          for name in SSH_HOST SSH_PORT SSH_USERNAME SSH_PRIVATE_KEY SSH_KNOWN_HOSTS DEPLOY_PATH; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::warning::Hostinger deployment skipped. Configure repository secrets: HOSTINGER_SSH_HOST, HOSTINGER_SSH_PORT, HOSTINGER_SSH_USERNAME, HOSTINGER_SSH_PRIVATE_KEY, HOSTINGER_SSH_KNOWN_HOSTS, HOSTINGER_DEPLOY_PATH."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy build/web to Hostinger
        if: steps.hostinger-config.outputs.ready == 'true' && github.ref == 'refs/heads/main'
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USERNAME: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "::error::Invalid SSH host"; exit 1; }
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] || { echo "::error::Invalid SSH port"; exit 1; }
          (( SSH_PORT >= 1 && SSH_PORT <= 65535 )) || { echo "::error::Invalid SSH port"; exit 1; }
          [[ "$SSH_USERNAME" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::Invalid SSH username"; exit 1; }
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "::error::Deploy path must be an absolute path"; exit 1; }
          [[ "$DEPLOY_PATH" == "/public_html" || "$DEPLOY_PATH" == */public_html ]] || { echo "::error::Deploy path must end in /public_html"; exit 1; }
          [[ "$DEPLOY_PATH" != *".."* ]] || { echo "::error::Deploy path cannot contain parent-directory segments"; exit 1; }

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/hostinger_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/hostinger_key" "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host hostinger
            HostName $SSH_HOST
            Port $SSH_PORT
            User $SSH_USERNAME
            IdentityFile $HOME/.ssh/hostinger_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
          EOF
          chmod 600 "$HOME/.ssh/config"

          rsync -avz -e "ssh -F $HOME/.ssh/config" build/web/ "hostinger:$DEPLOY_PATH/"
