name: Build CityMarket Business web app

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build original Flutter app for the web
        run: flutter build web --release

      - name: Verify the web build
        run: test -s build/web/index.html

      - name: Upload Hostinger-ready web files
        uses: actions/upload-artifact@v4
        with:
          name: citymarketbusiness-web
          path: build/web/
          if-no-files-found: error
          retention-days: 14
