<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    Alternatively, build your application passing the --base-href parameter
    specifying the new root path of your web app.

    Fore more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CityMarket Business">

  

  <meta name="robots" content="index, follow" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <!-- Open Graph & SEO tags -->
  <link rel="canonical" href="https://citymarketbusiness.com/">
  <meta property="og:title" content="CityMarket Business" />
  <meta property="og:description" content="Shop fresh groceries and everyday essentials with CityMarket Business." />
  <meta property="og:url" content="https://citymarketbusiness.com/" />
  <meta property="og:image" content="https://citymarketbusiness.com/icons/Icon-512.png" />
  <meta name="twitter:title" content="CityMarket Business" />
  <meta name="twitter:description" content="Shop fresh groceries and everyday essentials with CityMarket Business." />
  <meta name="twitter:image" content="https://citymarketbusiness.com/icons/Icon-512.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <title>CityMarket Business</title>
  <meta name="description" content="Shop fresh groceries and everyday essentials with CityMarket Business." />
    

  <!-- Status Bar color in Safari browser (iOS) and PWA -->
  <meta name="theme-color" content="#4B39EF">

  <link rel="manifest" href="manifest.json">
  
</head>
<body>
  
  
  
  
  
  
  <script>
    {{flutter_bootstrap_js}}
  </script>
</body>
</html>
